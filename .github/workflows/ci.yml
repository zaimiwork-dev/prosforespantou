name: CI

# The repo had no test/lint/build gate on push: `npm run test:run` and
# `npm run build` were only ever run by hand on the dev PC, which is how T11 P1
# sat uncommitted for 12 days and how a red build could reach main unnoticed.
# This is that gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # The Prisma client is generated, not committed — both the tests that
      # import lib modules and `next build` need it to exist first.
      - run: npx prisma generate

      - name: Tests
        run: npm run test:run

      # NOT blocking, deliberately: `npm run lint` exits 1 today on 5
      # pre-existing react-hooks/set-state-in-effect errors in the admin page
      # (plus 6 warnings). Making it blocking now would mean every PR starts
      # red, which trains people to ignore the whole workflow. Fix the admin
      # page, then delete this line and the step becomes a real gate.
      - name: Lint (non-blocking until the admin-page errors are fixed)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # prisma.ts builds its pg.Pool from DATABASE_URL; pages that read the
          # DB during prerender need a reachable database at build time. Nothing
          # else from the scrape secrets is needed — CI must not be able to
          # write through the direct (5432) connection.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

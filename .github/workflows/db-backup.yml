# Nightly database backup → private Cloudflare R2 bucket, last 14 days kept.
#
# Why: the Supabase Free plan keeps no backups. On 2026-11-03 a bad UPDATE
# wiped 64,829 image links and the expired-offer / discontinued-product links
# could not be recovered (CONTEXT.md, image incident). Owner chose this free
# option over Supabase Pro on 2026-11-04.
#
# What: pg_dump of the `public` schema (everything Prisma owns; Supabase's own
# auth/storage schemas are not ours and refuse a dump) in custom format, which
# is compressed and restorable table by table.
#
# Bucket `prosfores-db-backups` must stay PRIVATE (no public access, no custom
# domain) — unlike chain-images, which is public on images.prosforespantou.gr.
# The R2 token in secrets must have Object Read & Write on this bucket too.
#
# Restore (never straight onto production without thinking — it replaces data):
#   aws s3 cp s3://prosfores-db-backups/prosfores-YYYY-MM-DD.dump . --endpoint-url https://<account>.r2.cloudflarestorage.com
#   pg_restore --list prosfores-YYYY-MM-DD.dump                 # what is inside
#   pg_restore --no-owner --no-privileges --data-only -t products -d "<scratch db url>" prosfores-YYYY-MM-DD.dump
name: Nightly database backup

on:
  schedule:
    - cron: '30 1 * * *' # 03:30/04:30 Greek time, before the morning scrapes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUCKET: prosfores-db-backups
      KEEP_DAYS: 14
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Newer AWS CLIs add checksums R2 may reject; only send them when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      # The server is Postgres 17; pg_dump refuses a server newer than itself,
      # and the runner image ships an older client.
      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      # DIRECT_URL is the session pooler (port 5432, IPv4); the transaction
      # pooler on 6543 cannot serve pg_dump.
      - name: Dump and check
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          # The secret was saved with a trailing newline (and may carry the
          # quotes from .env.local); libpq then asks for database "postgres\n".
          DB_URL=$(printf '%s' "$DIRECT_URL" | tr -d '\r\n' | sed -e 's/^"//' -e 's/"$//')
          FILE="prosfores-$(date -u +%F).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --format=custom --schema=public \
            --no-owner --no-privileges --file="$FILE"
          # A dump that "succeeded" but lacks the core tables is not a backup.
          LIST=$(/usr/lib/postgresql/17/bin/pg_restore --list "$FILE")
          for t in products discounts chain_product_mappings price_snapshots; do
            echo "$LIST" | grep -q "TABLE DATA public $t " || { echo "::error::dump has no data for $t"; exit 1; }
          done
          BYTES=$(stat -c %s "$FILE")
          [ "$BYTES" -gt 5000000 ] || { echo "::error::dump is only $BYTES bytes"; exit 1; }
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "dump: $FILE, $(numfmt --to=iec "$BYTES"), $(echo "$LIST" | grep -c 'TABLE DATA') tables"

      - name: Upload and verify
        run: |
          set -euo pipefail
          aws s3 cp "$FILE" "s3://$BUCKET/$FILE" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          STORED=$(aws s3api head-object --bucket "$BUCKET" --key "$FILE" --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)
          [ "$STORED" = "$BYTES" ] || { echo "::error::stored $STORED bytes, dumped $BYTES"; exit 1; }
          echo "uploaded s3://$BUCKET/$FILE ($STORED bytes)"

      # Only reached when today's backup is verified, so pruning can never
      # leave the bucket empty.
      - name: Delete backups older than ${{ env.KEEP_DAYS }} days
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "-$KEEP_DAYS days" +%F)
          aws s3 ls "s3://$BUCKET/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep -E '^prosfores-[0-9]{4}-[0-9]{2}-[0-9]{2}\.dump$' | while read -r KEY; do
            DAY=${KEY#prosfores-}; DAY=${DAY%.dump}
            if [[ "$DAY" < "$CUTOFF" ]]; then
              aws s3 rm "s3://$BUCKET/$KEY" --endpoint-url "$R2_ENDPOINT" --only-show-errors
              echo "deleted $KEY"
            fi
          done
          echo "kept:"; aws s3 ls "s3://$BUCKET/" --endpoint-url "$R2_ENDPOINT"
